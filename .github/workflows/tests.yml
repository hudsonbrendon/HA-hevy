name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Lint
        run: |
          pip install ruff
          ruff check custom_components
      - name: Pytest
        if: hashFiles('tests/**/*.py') != ''
        run: |
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; else pip install pytest-homeassistant-custom-component; fi
          pytest
